<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KEYS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{color-scheme:dark;--fg:#fff;--bg:#04060c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:300 14px "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#menu{left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 9vh 6vw;position:fixed;pointer-events:none;z-index:4}
#menu h1{font-weight:200;letter-spacing:.5em;font-size:clamp(28px,5vw,60px);margin:0 0 4px}
#menu p{margin:0 0 4vh;opacity:.55;letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.mi{pointer-events:auto;background:none;border:0;border-left:1px solid transparent;color:#fff;font:200 clamp(18px,2.6vw,28px) "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;text-align:left;padding:10px 16px;cursor:pointer;opacity:.7;transition:.25s}
.mi:hover{opacity:1;border-color:#fff;padding-left:26px}
#hud{pointer-events:none;display:none}
.p{background:rgba(8,12,22,.7);border:1px solid #ffffff30;border-radius:8px;padding:8px 10px;backdrop-filter:blur(4px)}
#bars{position:absolute;left:10px;top:10px;width:190px}
.bar{height:8px;background:#0a0f1a;border-radius:6px;overflow:hidden;margin:2px 0 7px}
.bar i{display:block;height:100%;width:100%}#hp i{background:linear-gradient(90deg,#ff4d5e,#ff8a5a)}#st i{background:linear-gradient(90deg,#3ee08a,#d8f24a)}
button{font:inherit;color:#fff;background:rgba(8,12,22,.7);border:1px solid #ffffff40;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:#fff;color:#000}
#gear{position:absolute;right:10px;top:10px;pointer-events:auto}
#hb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
.sl{width:78px;height:54px;border:1px solid #ffffff40;border-radius:8px;background:rgba(8,12,22,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;pointer-events:auto;cursor:pointer}
.sl b{font-weight:200;opacity:.5;font-size:10px}.sl.s{border-color:#fff;background:rgba(255,255,255,.18)}
#msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:15px;opacity:0;transition:opacity .3s;text-shadow:0 0 8px #000;letter-spacing:.1em;text-align:center;width:90%}
#big{position:absolute;left:0;right:0;top:36%;text-align:center;font:200 clamp(26px,6vw,64px) "Helvetica Neue",Arial,sans-serif;letter-spacing:.4em;opacity:0;transition:opacity 1s;text-shadow:0 0 20px #000}
#pov{position:absolute;left:50%;top:7%;transform:translateX(-50%);letter-spacing:.4em;font-size:12px;color:#f55;display:none}
#dlg{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);width:min(680px,94%);display:none;gap:12px;align-items:center;pointer-events:auto;cursor:pointer;background:rgba(5,8,16,.88)}
#dlg img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #fff}
#dn{font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.8;margin-bottom:4px}#dt{font-size:17px;line-height:1.4}
#dh{position:absolute;right:10px;bottom:6px;font-size:10px;opacity:.4}
#touch{display:none;position:absolute;inset:0;pointer-events:none}.mob #touch{display:block}
#joy{position:absolute;left:22px;bottom:90px;width:120px;height:120px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;pointer-events:auto}
#knob{position:absolute;left:30px;top:30px;width:60px;height:60px;border-radius:50%;background:#ffffff66}
.tb{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;font-weight:700;font-size:10px;padding:0}
#set,#end{display:none;z-index:9;background:rgba(2,4,8,.92);align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center}
#set h2{font-weight:200;letter-spacing:.5em;margin:0}.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#set small{opacity:.55;max-width:420px;line-height:1.5}.lb{letter-spacing:.25em;text-transform:uppercase;font-size:11px;opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"><h1>KEYS</h1><p>Five crew · One ship · Too many keys</p><p id="snd" style="margin-top:-3vh">Click anywhere to start the music</p>
<button class="mi" id="bS">Story</button><button class="mi" id="bM">Multiplayer</button><button class="mi" id="bT">Settings</button></div>
<div id="hud" class="ov">
 <div id="bars" class="p"><div id="who">HEALTH</div><div class="bar" id="hp"><i></i></div><div>STAMINA</div><div class="bar" id="st"><i></i></div><div id="zone" style="opacity:.6"></div></div>
 <button id="gear">⚙ Settings</button><div id="msg"></div><div id="big"></div><div id="pov">● SPEED POV</div>
 <div id="dlg" class="p"><img id="dp"><div><div id="dn"></div><div id="dt"></div></div><div id="dh">click / E / Space</div></div>
 <div id="hb"></div>
 <div id="touch"><div id="joy"><div id="knob"></div></div>
  <button class="tb" data-b="atk" style="right:24px;bottom:130px;background:#7a1d2acc">FIRE</button>
  <button class="tb" data-b="spr" style="right:104px;bottom:170px;background:#1d7a4acc">RUN</button>
  <button class="tb" data-b="pick" style="right:104px;bottom:92px;background:#17517acc">TAKE</button>
  <button class="tb" data-b="drop" style="right:24px;bottom:50px;background:#5a4a1acc">DROP</button></div>
</div>
<div id="set" class="ov"><h2>SETTINGS</h2>
 <div class="lb">Graphics</div><div class="row" id="gfx"></div><small id="gd"></small>
 <div class="lb">Epilepsy safe mode</div><div class="row"><button id="ep"></button></div>
 <small>Turns off flickering lights, the light-break flash, red hit flashes and bright gunshots.</small>
 <div class="lb">Music volume</div><input type="range" id="vol" min="0" max="100" value="60">
 <button id="back">Back</button></div>
<div id="end" class="ov"><h2 style="font-weight:200;letter-spacing:.4em">TO BE CONTINUED…</h2><button onclick="location.reload()">Back to menu</button></div>
